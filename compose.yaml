# Expects the server layout described in DEPLOY.md:
#   /srv/xclipboard/app   <- this repo
#   /srv/xclipboard/data  <- database + logs (back these up)
#   /srv/xclipboard/.env  <- secrets/config, see .env.example
#   /srv/xclipboard/app/.env -> ../.env (symlink, so compose can read APP_UID/APP_GID below)
name: xclipboard

services:
  xclipboard:
    build:
      context: .
      args:
        # The xclipboard host user that owns ../data. No default on purpose: never fall back to your own UID
        UID: ${APP_UID:?APP_UID missing, see DEPLOY.md}
        GID: ${APP_GID:?APP_GID missing, see DEPLOY.md}
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Only Caddy can reach the port (bound to 127.0.0.1 below), so trust its X-Forwarded-For
      FORWARDED_ALLOW_IPS: "*"
    ports:
      # Keep the 127.0.0.1 prefix: Docker-published ports bypass ufw
      - "127.0.0.1:8001:8001"
    volumes:
      - ../data/db:/app/data
      - ../data/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
